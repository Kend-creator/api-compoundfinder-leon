<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Compound Element Finder</title>
    <link rel="stylesheet" href="style.css" >
</head>


<body>
    <header>
        <h1>🧪 Simple Compound Element Finder</h1>
        <p> A website powered by a REST API </p>
    </header>
    <main>

        <!-- SEARCH -->
        <section class="search">
            <input type="text" id="searchInput" placeholder="Search for a compound...">
            <button onclick="searchCompounds()"> Search </button>
            <button class="secondary" onclick="loadCompounds()"> Show All </button>

        </section>

        <section>
            <h2>Compounds</h2>
            <div id="compoundList" class="compound-list">
                Loading compounds...
            </div>
        </section>
    </main>

    <footer>
        <p> Data provided by the Simple Compound Element API </p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
