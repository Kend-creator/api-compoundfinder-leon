<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Finder · Compound Lab</title>
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="style.css">
    <script>
      try {
        const saved = localStorage.getItem("compound-lab-theme");
        const pref = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = saved || pref;
      } catch { document.documentElement.dataset.theme = "light"; }
    </script>
</head>
<body>
<div class="site-shell">
    <header class="topbar">
        <a class="brand" href="../" aria-label="Compound Lab home">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
            <span>COMPOUND</span><strong>LAB</strong>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a class="is-active" href="../finder/">Finder</a>
            <a href="../craft/">Craft</a>
            <a href="../combine/">Combine</a>
            <a href="../guessr/">Play Guessr</a>
        </nav>
        <div class="topbar-actions">
            <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
                <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.7 8.7 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z"></path></svg>
                <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.7"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
            </button>
            <button class="menu-button" type="button" aria-expanded="false" aria-label="Toggle menu"><span></span><span></span></button>
        </div>
    </header>

    <main class="finder">
        <section class="finder-head">
            <div class="finder-grid" aria-hidden="true"></div>
            <div class="finder-head-inner">
                <span class="f-kicker">01 · DATABASE</span>
                <h1>Compound <em>Finder.</em></h1>
                <p>Search structures, properties and safety details for every compound in the lab.</p>
            </div>
        </section>

        <div class="finder-body">
            <section class="search">
                <input type="text" id="searchInput" placeholder="Search by name or formula, e.g. H2O">
                <button class="btn-primary" onclick="searchCompounds()">Search</button>
                <button class="secondary" onclick="loadCompounds()">Show all</button>
            </section>

            <div class="f-heading"><span class="f-kicker">RESULTS</span><span class="f-rule"></span></div>
            <div id="compoundList" class="compound-list">
                <p class="status-text">Loading compounds…</p>
            </div>
        </div>
    </main>

    <footer>
        <a class="brand footer-brand" href="../">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
            <span>COMPOUND</span><strong>LAB</strong>
        </a>
        <p>Explore responsibly. Stay curious.</p>
        <span>© 2026 COMPOUND LAB</span>
    </footer>

    <div id="detailOverlay" class="modal-overlay" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>
</div>
<script src="app.js"></script>
<script type="module" src="../main.js"></script>
</body>
</html>
