<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Compound Lab</title>
        <link rel="stylesheet" href="./index.css" />
    </head>
    <body>
        <div class="site-shell" id="root">
            <header class="topbar">
                <a class="brand" href="#" aria-label="Compound Lab home">
                <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
                <span>COMPOUND</span>
                <strong>LAB</strong>
                </a>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="#experiences">Finder</a>
                <a href="#experiences">Craft</a>
                <a href="#experiences">Combine</a>
                <button type="button" data-launch="Compound Guessr">Play Guessr</button>
            </nav>

            <div class="topbar-actions">
                <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
                    <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.2 15.4A8.7 8.7 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z"></path>
                    </svg>
                    <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="3.7"></circle>
                        <path
                            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                        ></path>
                    </svg>
                </button>
                <button class="menu-button" type="button" aria-expanded="false" aria-label="Toggle menu">
                    <span></span><span></span>
                </button>
            </div>
            
            <main>
                <section class ="hero">
                    <div class="hero-grid" aria-hidden="true"></div>
                    <div class="hero-copy">
                        <div class="status-pill"><span></span>THE LAB IS OPEN</div>
                            <h1>Chemistry,<br /><em>made curious.</em></h1>
                            <p>
                                Search real compounds. Build impossible molecules. Mix, discover, and put your
                                chemistry knowledge to the test.
                            </p>
                        <div class="hero-actions">
                            <a class="primary-action" href="#experiences">Explore the lab <span>↘</span></a>
                            <button class="text-action" type="button" data-launch="Compound Guessr">
                                Play Compound Guessr <span>→</span>
                            </button>
                        </div>
                        <div class="trust-line">
                            <div class="mini-atoms" aria-hidden="true"><i></i><i></i><i></i></div>
                            <span>Powered by <strong>open chemical data</strong></span>
                        </div>
                    </div>
                </section>
            </main>

            </header>
        </div>
    </body>
</html>
